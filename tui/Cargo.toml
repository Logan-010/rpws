[package]
name = "rpws"
version = "0.1.0"
edition = "2024"
description = "Reliable P2P password manager."
authors = ["Logan-010"]

[dependencies]
libp2p-kad-redb = { workspace = true }
base64 = "0.23.1"
cid = "0.11.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
color-eyre = "0.6.5"
directories = "6.0.0"
libp2p = { version = "0.57.0", features = ["autonat", "dcutr", "dns", "identify", "kad", "macros", "mdns", "noise", "ping", "quic", "relay", "rsa", "serde", "tcp", "tokio", "upnp", "websocket", "yamux"] }
multihash-codetable = { version = "0.2.2", features = ["blake3"] }
postcard = { version = "1.1.3", features = ["use-std"] }
ratatui = { version = "0.30.2", default-features = false, features = ["all-widgets", "crossterm", "std"] }
redb = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "fs", "signal", "net"] }
toml = "1.1.8"
tracing = "0.1.44"
shared = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rand = "0.10.3"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "http2"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
