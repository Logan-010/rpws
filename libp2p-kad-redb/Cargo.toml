[package]
name = "libp2p-kad-redb"
version = "0.1.0"
edition = "2024"
description = "ReDB store for Libp2p-KAD (Kademlia DHT)."
authors = ["Logan-010"]

[dependencies]
libp2p = { version = "0.57.0", features = ["kad", "serde"] }
postcard = { version = "1.1.3", features = ["use-std"] }
redb = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
