[package]
name = "rpws"
version = "0.1.0"
edition = "2024"
description = "Reliable P2P password manager."
authors = ["Logan-010"]

[lib]
name = "libp2p_kad_redb"
path = "libp2p-kad-redb/lib.rs"

[dependencies]
base64 = "0.23.1"
cid = "0.11.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
color-eyre = "0.6.5"
directories = "6.0.0"
libp2p = { version = "0.57.0", features = ["autonat", "dcutr", "dns", "identify", "kad", "macros", "mdns", "noise", "ping", "quic", "relay", "rsa", "serde", "tcp", "tokio", "upnp", "yamux"] }
multihash-codetable = { version = "0.2.2", features = ["blake3"] }
postcard = { version = "1.1.3", features = ["use-std"] }
ratatui = { version = "0.30.2", default-features = false, features = ["all-widgets", "crossterm", "std"] }
redb = "4.3.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "fs", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
rpath = false
overflow-checks = false

[dev-dependencies]
tempfile = "3.27.0"
