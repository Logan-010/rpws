[workspace]
resolver = "3"
members = ["libp2p-kad-redb", "shared", "app"]

[workspace.dependencies]
# Internal
libp2p-kad-redb = { path = "libp2p-kad-redb" }
shared = { path = "shared" }

# Locked
redb = "4.3.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
rpath = false
overflow-checks = false

