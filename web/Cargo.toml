[package]
name = "web"
version = "0.1.0"
edition = "2024"
authors = ["Logan-010"]
description = "WASM interface for RPWS"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
color-eyre = "0.6.5"
gloo-timers = { version = "0.3.0", features = ["futures"] }
libp2p = { version = "0.57.0", features = ["cbor", "request-response", "dns", "identify", "kad", "macros", "noise", "ping", "serde", "websocket-websys", "yamux"] }
multihash-codetable = { version = "0.2.2", features = ["blake3"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
shared = { workspace = true }
tracing = "0.1.44"
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.58"
web-time = { version = "1.1.0", features = ["serde"] }
